<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Anda sedang offline</title>
    <style>
        :root { color-scheme: light dark; }
        html, body {
            margin: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: #212121;
            color: #fafafa;
            text-align: center;
            padding: 1.5rem;
        }
        .card { max-width: 24rem; }
        h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
        p { margin: 0; opacity: 0.7; font-size: 0.95rem; }
        button {
            margin-top: 1.25rem;
            padding: 0.6rem 1.25rem;
            border-radius: 0.5rem;
            border: 1px solid #fafafa;
            background: transparent;
            color: #fafafa;
            font-size: 0.95rem;
            cursor: pointer;
        }
        button:active { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Anda sedang offline</h1>
        <p>Periksa koneksi internet Anda, lalu coba lagi.</p>
        <button type="button" onclick="location.reload()">Coba Lagi</button>
    </div>
</body>
</html>
