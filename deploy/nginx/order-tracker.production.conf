# Production nginx template for wildcard multi-tenant hosting.
# 1. Replace YOUR_DOMAIN.COM with your real domain (e.g. ordertracker.id).
# 2. Replace /var/www/html/order-tracker with your deploy path.
# 3. Point ssl_certificate paths to your wildcard cert (certbot or origin cert).
# 4. sudo ln -sf .../deploy/nginx/order-tracker.production.conf /etc/nginx/sites-enabled/order-tracker
# 5. sudo nginx -t && sudo systemctl reload nginx
#
# Shared apex (another app owns YOUR_DOMAIN.COM): use order-tracker.shared-apex.conf instead.
# See docs/PRODUCTION.md for DNS, .env, and first-deploy steps.

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.COM *.YOUR_DOMAIN.COM;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN.COM *.YOUR_DOMAIN.COM;

    root /var/www/html/order-tracker/public;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.COM/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    index index.php;
    charset utf-8;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Content-hashed Vite assets are safe to cache for a year.
    # add_header in a location block replaces inherited headers, so the
    # server-level security headers are repeated here.
    location /build/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Landing images are hash-busted via ?v= query strings in Landing.tsx.
    location /landing/ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
