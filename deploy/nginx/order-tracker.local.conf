# Local multi-tenant dev (port 8084).
# Install: sudo ln -sf /var/www/html/order-tracker/deploy/nginx/order-tracker.local.conf /etc/nginx/sites-enabled/order-tracker
#         sudo nginx -t && sudo nginx -s reload
#
# Requires TENANT_BASE_DOMAIN=localhost and APP_URL=http://localhost:8084 in .env.

server {
    listen 8084;
    listen [::]:8084;
    server_name localhost 127.0.0.1 *.localhost;

    root /var/www/html/order-tracker/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Preserve port in HTTP_HOST (Debian nginx defaults strip it).
        fastcgi_param HTTP_HOST $http_host;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
